<section id="skills" class="skills-section">
    <div class="container">
        <h2 class="section-title">Skills & Expertise</h2>

        <div class="skills-grid">
            <div class="skill-category" *ngFor="let category of skillCategories">
                <div class="category-header">
                    <span class="category-icon" [ngSwitch]="category.icon">
                        <!-- Frontend SVG (Code) -->
                        <svg *ngSwitchCase="'frontend'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
                        <!-- Data SVG (Database) -->
                        <svg *ngSwitchCase="'data'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
                        <!-- Animations SVG (Sparkles) -->
                        <svg *ngSwitchCase="'animations'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
                        <!-- Tools SVG (Wrench) -->
                        <svg *ngSwitchCase="'tools'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                    </span>
                    <h3 class="category-title">{{ category.title }}</h3>
                </div>

                <div class="skills-list">
                    <div class="skill-item" *ngFor="let skill of category.skills">
                        <div class="skill-info">
                            <span class="skill-name">{{ skill.name }}</span>
                            <span class="skill-percentage">{{ skill.level }}%</span>
                        </div>
                        <div class="skill-progress">
                            <div class="skill-progress-fill" [style.width.%]="skill.level"
                                [attr.data-level]="skill.level">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
