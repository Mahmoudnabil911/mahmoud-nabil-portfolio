<section id="projects" class="projects-section">
    <div class="container">
        <h2 class="section-title">Featured Projects</h2>

        <div class="projects-grid">
            <div class="project-card" *ngFor="let project of projects">
                <div class="project-image">
                    <span *ngIf="project.inProgress" class="in-progress-badge"> In Progress</span>
                    <div class="image-placeholder">
                        <img *ngIf="project.image.startsWith('/')" [src]="project.image" [alt]="project.title"
                            class="project-img" [ngClass]="project.imageClass || ''">
                        <span *ngIf="!project.image.startsWith('/')" class="project-icon" [ngSwitch]="project.image">
                            <!-- LMS SVG (Book) -->
                            <svg *ngSwitchCase="'lms'" xmlns="http://www.w3.org/2000/svg" width="60" height="60"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
                            </svg>
                            <!-- Khardah SVG (Users/Community) -->
                            <svg *ngSwitchCase="'khardah'" xmlns="http://www.w3.org/2000/svg" width="60" height="60"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                            <!-- Deelz SVG (Text Logo) -->
                            <svg *ngSwitchCase="'deelz'" xmlns="http://www.w3.org/2000/svg" width="180" height="60" viewBox="0 0 180 60">
                                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="28" font-weight="800" font-family="system-ui, -apple-system, sans-serif" fill="currentColor" letter-spacing="-1">Deelz CRM</text>
                            </svg>
                        </span>
                    </div>
                    <div class="project-overlay">
                        <div class="overlay-content">
                            <a [href]="project.demoUrl" class="overlay-btn" target="_blank" rel="noopener">
                                <span>🔗</span> Live Demo
                            </a>
                            <!-- <a [href]="project.githubUrl" class="overlay-btn" target="_blank" rel="noopener">
                                <span>💻</span> GitHub
                            </a> -->
                        </div>
                    </div>
                </div>

                <div class="project-content">
                    <h3 class="project-title">{{ project.title }}</h3>
                    <h4 class="project-subtitle">{{ project.subtitle }}</h4>
                    <p class="project-description">{{ project.description }}</p>

                    <div class="project-highlights">
                        <span class="highlight-badge" *ngFor="let highlight of project.highlights">
                            ✨ {{ highlight }}
                        </span>
                    </div>

                    <div class="project-technologies">
                        <span class="tech-badge" *ngFor="let tech of project.technologies">
                            {{ tech }}
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
