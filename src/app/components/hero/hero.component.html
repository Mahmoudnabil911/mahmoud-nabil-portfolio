<section id="hero" class="hero">
    <div class="hero-background">
        <!-- Colored Blur Blobs -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <!-- Floating Tech Elements -->
        <div class="floating-elements">
            <span class="float-el el-1">&lt; / &gt;</span>
            <span class="float-el el-2">{{ '{' }} {{ '}' }}</span>
            <span class="float-el el-3">TS</span>
            <span class="float-el el-4">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="40" height="40">
                    <path fill="#DD0031" d="M125 30L31.9 63.2l14.2 123.1L125 230l78.9-43.7 14.2-123.1z" />
                    <path fill="#C3002F" d="M125 30v22.2-.1V230l78.9-43.7 14.2-123.1L125 30z" />
                    <path fill="#FFA3B1"
                        d="M125 52.1L66.8 182.6h21.7l11.7-29.2h49.4l11.7 29.2H183L125 52.1zm17 83.3h-34l17-40.9 17 40.9z" />
                    <path fill="#F2F2F2" d="M125 52.1v67.8l-17 40.9h34z" />
                </svg>
            </span>
            <span class="float-el el-5">()</span>
            <span class="float-el el-6">#</span>
            <span class="float-el el-7">;&nbsp;</span>

        </div>
    </div>

    <div class="hero-content">
        <h1 class="hero-title">
            Hi, I'm <span class="gradient-text">Mahmoud Nabil</span>
        </h1>

        <h2 class="hero-subtitle">Frontend Developer | React &amp; Angular</h2>

        <p class="hero-location">
            <span class="location-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
            </span>
            Nasr City, Cairo, Egypt
        </p>

        <div class="hero-description">
            <p class="typed-text">{{ typedText }}<span class="cursor">|</span></p>
        </div>

        <div class="hero-cta">
            <button class="btn btn-primary" (click)="downloadCV()">
                <span class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" x2="12" y1="15" y2="3" />
                    </svg>
                </span>
                Download CV
            </button>
            <button class="btn btn-secondary" (click)="scrollToProjects()">
                <span class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="14" x="2" y="7" rx="2" ry="2" />
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                    </svg>
                </span>
                View Projects
            </button>
        </div>
    </div>
</section>
