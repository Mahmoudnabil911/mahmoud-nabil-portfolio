<section id="contact" class="contact-section">
    <div class="container">
        <h2 class="section-title">Get In Touch</h2>
        <p class="section-subtitle">
            Have a project in mind or want to collaborate? Feel free to reach out!
        </p>

        <div class="contact-grid">
            <div class="contact-info">
                <div class="contact-card" *ngFor="let info of contactInfo">
                    <a [href]="info.link" class="contact-link" target="_blank" rel="noopener">
                        <span class="contact-icon" [ngSwitch]="info.icon">
                            <!-- Email SVG -->
                            <svg *ngSwitchCase="'email'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2" />
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                            </svg>
                            <!-- WhatsApp SVG -->
                            <svg *ngSwitchCase="'whatsapp'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                            </svg>
                            <!-- LinkedIn SVG -->
                            <svg *ngSwitchCase="'linkedin'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
                                <rect width="4" height="12" x="2" y="9" />
                                <circle cx="4" cy="4" r="2" />
                            </svg>
                            <!-- GitHub SVG -->
                            <svg *ngSwitchCase="'github'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
                                <path d="M9 18c-4.51 2-5-2-7-2" />
                            </svg>
                        </span>
                        <div class="contact-details">
                            <h4 class="contact-label">{{ info.label }}</h4>
                            <p class="contact-value">{{ info.value }}</p>
                        </div>
                    </a>
                </div>
            </div>

            <div class="contact-form-wrapper">
                <form class="contact-form" (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" name="name" class="form-input" [(ngModel)]="formData.name"
                            placeholder="Your Name" required />
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-input" [(ngModel)]="formData.email"
                            placeholder="your.email@example.com" required />
                    </div>

                    <div class="form-group">
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" id="subject" name="subject" class="form-input" [(ngModel)]="formData.subject"
                            placeholder="Project Inquiry" required />
                    </div>

                    <div class="form-group">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" name="message" class="form-textarea" [(ngModel)]="formData.message"
                            placeholder="Tell me about your project..." rows="5" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn" [disabled]="isSubmitting">
                        <span class="btn-icon" *ngIf="!isSubmitting">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="m22 2-7 20-4-9-9-4Z" />
                                <path d="M22 2 11 13" />
                            </svg>
                        </span>
                        <span class="btn-icon" *ngIf="isSubmitting">⏳</span>
                        {{ isSubmitting ? 'Sending...' : 'Send Message' }}
                    </button>

                    <!-- Feedback Messages -->
                    <div class="form-feedback success" *ngIf="submitSuccess">
                        ✅ Message sent successfully! I will get back to you soon.
                    </div>
                    <div class="form-feedback error" *ngIf="submitError">
                        ❌ Oops! Something went wrong. Please try again.
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p class="footer-text">
            © 2026 Mahmoud Nabil.
        </p>
    </div>
</footer>
